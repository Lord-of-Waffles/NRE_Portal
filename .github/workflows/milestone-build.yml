name: Milestone (Build, Test, Deploy to GCP)

on:
  workflow_dispatch:  # manual trigger only

env:
  REGISTRY: ghcr.io
  GCP_REGION: us-central1

jobs:
  build:
    name: Build and Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set lowercase repository owner
        id: repo
        run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: WebAPI_NRE-Portal
          file: WebAPI_NRE-Portal/WebAPI_NRE-Portal/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/nre-portal-api:${{ github.run_number }}
            ghcr.io/${{ steps.repo.outputs.owner }}/nre-portal-api:latest
      
      - name: Build and Push MVC Image
        uses: docker/build-push-action@v5
        with:
          context: WebAPI_NRE-Portal
          file: WebAPI_NRE-Portal/MVC_NRE-Portal/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/nre-portal-mvc:${{ github.run_number }}
            ghcr.io/${{ steps.repo.outputs.owner }}/nre-portal-mvc:latest

  test:
    name: Run Unit Tests
    needs: build
    runs-on: windows-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      
      - name: Restore packages
        run: dotnet restore WebAPI_NRE-Portal/WebAPI_NRE-Portal.sln
      
      - name: Run xUnit Tests
        run: |
          Get-ChildItem -Recurse -Filter "*_Tests.csproj" | ForEach-Object {
            Write-Host "Running tests for $($_.FullName)"
            dotnet test $_.FullName --configuration Release --logger "trx;LogFileName=test_results.trx"
          }
        shell: pwsh
      
      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: '**/test_results.trx'
          reporter: dotnet-trx
          fail-on-error: true

  deploy:
    name: Deploy to Google Cloud Run
    needs: [build, test]
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set lowercase repository owner
        id: repo
        run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Configure Docker for GHCR
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      
      - name: Deploy API to Cloud Run
        run: |
          gcloud run deploy nre-portal-api \
            --image ghcr.io/${{ steps.repo.outputs.owner }}/nre-portal-api:latest \
            --platform managed \
            --region ${{ env.GCP_REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --memory 1Gi \
            --cpu 1 \
            --set-env-vars ASPNETCORE_ENVIRONMENT=Development,ASPNETCORE_URLS=http://+:8080 \
            --project ${{ secrets.GCP_PROJECT_ID }}
          
          API_URL=$(gcloud run services describe nre-portal-api \
            --platform managed \
            --region ${{ env.GCP_REGION }} \
            --format 'value(status.url)' \
            --project ${{ secrets.GCP_PROJECT_ID }})
          
          echo "API_URL=$API_URL" >> $GITHUB_ENV
          echo "API deployed at: $API_URL"
      
      - name: Deploy MVC to Cloud Run
        run: |
          gcloud run deploy nre-portal-mvc \
            --image ghcr.io/${{ steps.repo.outputs.owner }}/nre-portal-mvc:latest \
            --platform managed \
            --region ${{ env.GCP_REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --memory 1Gi \
            --cpu 1 \
            --set-env-vars ASPNETCORE_ENVIRONMENT=Development,ASPNETCORE_URLS=http://+:8080,ApiBaseUrl=${{ env.API_URL }} \
            --project ${{ secrets.GCP_PROJECT_ID }}
          
          MVC_URL=$(gcloud run services describe nre-portal-mvc \
            --platform managed \
            --region ${{ env.GCP_REGION }} \
            --format 'value(status.url)' \
            --project ${{ secrets.GCP_PROJECT_ID }})
          
          echo ""
          echo "========================================="
          echo "Deployment Complete!"
          echo "========================================="
          echo "API: ${{ env.API_URL }}/swagger"
          echo "MVC: $MVC_URL"
          echo "========================================="
